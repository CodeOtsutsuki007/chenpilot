name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  eslint-strict:
    name: ESLint (strict - new code)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        # npm install instead of npm ci: lock file may be out of sync with
        # recently added packages (socket.io, etc.). npm install regenerates
        # the lock file as needed without failing.
        run: npm pkg set 'devDependencies.prettier=^3.5.3' && npm install --legacy-peer-deps

      - name: Run ESLint (zero warnings allowed)
        run: |
          npx eslint \
            src/Agents/sandbox/ \
            src/Agents/registry/ \
            src/Agents/planner/ \
            --max-warnings 0
  eslint-audit:
    name: ESLint (audit - full repo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm pkg set 'devDependencies.prettier=^3.5.3' && npm install --legacy-peer-deps

      - name: Run ESLint (full repo – informational)
        run: npx eslint . --format stylish || true
  telemetry-lint:
    name: Telemetry lint (cardinality budgets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run telemetry lint
        run: npm run lint:telemetry
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm pkg set 'devDependencies.prettier=^3.5.3' && npm install --legacy-peer-deps

      - name: Check formatting
        run: npx prettier --check "src/Agents/sandbox/**" "src/Agents/registry/**" "src/Agents/planner/**"
  privilege-graph:
    name: Privilege graph review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm pkg set 'devDependencies.prettier=^3.5.3' && npm install --legacy-peer-deps

      - name: Check committed privilege graph matches the policy catalog
        run: npm run authz:graph:check
